# Carte à ajouter dans la vue Lovelace (ex. ecranmural) : Mode YAML sur le dashboard

type: vertical-stack
title: YouTube — écran mural
cards:
  - type: entity
    entity: input_text.mural_youtube_url
    name: Lien vidéo ou playlist
    icon: mdi:link-variant
  - type: entity
    entity: input_boolean.mural_youtube_audio_bose
    name: Son sur la Bose (vidéo muette sur le mur)
  - type: entities
    title: Niveaux son
    show_header_toggle: false
    entities:
      - entity: sensor.mural_pi_hdmi_volume
        name: Pi HDMI (niveau actuel)
      - entity: input_number.mural_pi_hdmi_volume
        name: Pi HDMI (réglage)
      - entity: sensor.mural_bose_volume
        name: Bose (niveau actuel)
      - entity: input_number.mural_bose_volume
        name: Bose (réglage)
  - type: button
    name: Lancer sur le mur (onglet 2)
    icon: mdi:youtube
    show_icon: true
    tap_action:
      action: call-service
      service: script.mural_lancer_youtube_onglet2
  - type: button
    name: Revenir à Home Assistant (onglet 1)
    icon: mdi:home-assistant
    tap_action:
      action: call-service
      service: rest_command.rasp5_kiosk_focus_ha_tab1
