# Mur Pi — Lovelace (1 onglet). packages/kiosk_youtube_onglet2.yaml doit rester .disabled
# L’alias mural_lancer_youtube_onglet2 évite les boutons / automations encore sur l’ancien id.

input_text:
  mural_youtube_url:
    name: YouTube (écran mural)
    icon: mdi:youtube
    max: 255
    initial: ""
    mode: text
  mural_youtube_embed:
    name: URL embed YouTube (mur)
    icon: mdi:youtube-subscription
    max: 255
    initial: ""
  mural_lovelace_path_home:
    name: Chemin Lovelace — accueil mur
    icon: mdi:home
    max: 120
    initial: "/lovelace/dashboard-principal"
  mural_lovelace_path_youtube:
    name: Chemin mur YouTube (local HA)
    icon: mdi:television
    max: 160
    initial: "/local/mural-youtube-embed.html"

input_boolean:
  mural_youtube_audio_bose:
    name: Audio sur la Bose (Chromecast)
    icon: mdi:speaker-wireless
    initial: true

input_select:
  mural_bose_media_player:
    name: Lecteur Bose (mur YouTube)
    icon: mdi:speaker
    options:
      - media_player.musique_bose_4
      - media_player.musique_bose_2
      - media_player.musique_bose
    initial: media_player.musique_bose_2

input_number:
  mural_pi_hdmi_volume:
    name: Mur réglage volume Pi HDMI
    icon: mdi:television-speaker
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    initial: 50
  mural_bose_volume:
    name: Mur réglage volume Bose
    icon: mdi:speaker-wireless
    min: 0
    max: 100
    step: 5
    unit_of_measurement: "%"
    mode: slider
    initial: 55

rest:
  - resource: "http://192.168.1.56:8765/audio"
    method: GET
    scan_interval: 20
    timeout: 10
    headers:
      Authorization: !secret rasp5_kiosk_http_authorization
    sensor:
      - name: "Mural Pi HDMI volume"
        unique_id: mural_pi_hdmi_volume_sensor
        value_template: "{{ value_json.volume_percent | default(0) | int }}"
        unit_of_measurement: "%"
        icon: mdi:television-speaker
        json_attributes:
          - muted
          - ok

template:
  - sensor:
      - name: "Mural Bose volume"
        unique_id: mural_bose_volume_sensor
        unit_of_measurement: "%"
        icon: mdi:speaker-wireless
        state: >-
          {% set p = states('input_select.mural_bose_media_player')
             | default('media_player.musique_bose_2', true) | trim %}
          {% set v = state_attr(p, 'volume_level') %}
          {% if v is number %}
            {{ (v * 100) | round(0) }}
          {% else %}
            {{ states('input_number.mural_bose_volume') | int(55) }}
          {% endif %}

automation:
  - id: mural_appliquer_volume_pi_hdmi
    alias: Mur — régler volume HDMI Pi
    mode: queued
    trigger:
      - platform: state
        entity_id: input_number.mural_pi_hdmi_volume
    condition:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and (trigger.to_state.state | float(0)
                  - trigger.from_state.state | float(0)) | abs > 0.01 }}
    action:
      - action: rest_command.rasp5_kiosk_set_pi_volume
        data:
          volume_percent: "{{ states('input_number.mural_pi_hdmi_volume') | int }}"

  - id: mural_appliquer_volume_bose
    alias: Mur — régler volume Bose
    mode: queued
    trigger:
      - platform: state
        entity_id: input_number.mural_bose_volume
    condition:
      - condition: template
        value_template: >-
          {{ trigger.from_state is not none
             and (trigger.to_state.state | float(0)
                  - trigger.from_state.state | float(0)) | abs > 0.01 }}
    action:
      - action: media_player.volume_set
        target:
          entity_id: >-
            {{ states('input_select.mural_bose_media_player')
               | default('media_player.musique_bose_2', true) | trim }}
        data:
          volume_level: >-
            {{ (states('input_number.mural_bose_volume') | float(55) / 100) | round(2) }}
      - action: media_player.volume_mute
        target:
          entity_id: >-
            {{ states('input_select.mural_bose_media_player')
               | default('media_player.musique_bose_2', true) | trim }}
        data:
          is_volume_muted: false

script:
  mural_lancer_youtube_onglet2:
    alias: Mur — YouTube onglet 2 (alias → Lovelace)
    mode: single
    icon: mdi:television-play
    fields:
      url:
        description: URL YouTube (optionnel)
    sequence:
      - action: script.mural_afficher_youtube_lovelace
        data:
          url: "{{ url | default('') }}"

  mural_afficher_youtube_lovelace:
    alias: Mur — YouTube (vue Lovelace)
    mode: single
    icon: mdi:television-play
    fields:
      url:
        description: URL YouTube (optionnel)
    sequence:
      - variables:
          target_url: >-
            {% set u = (url | default('') | trim) %}
            {{ u if u else states('input_text.mural_youtube_url') | trim }}
          youtube_id: >-
            {% if 'youtu.be/' in target_url %}
            {{ target_url.split('youtu.be/')[1].split('?')[0].split('/')[0] }}
            {% elif 'v=' in target_url %}
            {{ target_url.split('v=')[1].split('&')[0] }}
            {% else %}
            {{ '' }}
            {% endif %}
          embed_url: >-
            {% if youtube_id | length >= 6 %}
            https://www.youtube-nocookie.com/embed/{{ youtube_id }}?autoplay=1&rel=0
            {% else %}
            {{ '' }}
            {% endif %}
          url_ok: "{{ embed_url | length > 20 }}"
          bose_audio: >-
            {% set s = states('input_boolean.mural_youtube_audio_bose') %}
            {{ s == 'on' if s not in ['unknown', 'unavailable'] else true }}
          bose_player: >-
            {{ states('input_select.mural_bose_media_player')
               | default('media_player.musique_bose_2', true) | trim }}
          navigate_mute: "{{ 1 if bose_audio else 0 }}"
          navigate_url: >-
            https://www.youtube.com/watch?v={{ youtube_id }}{% if bose_audio %}&mute=1{% endif %}
          navigate_embed_url: >-
            http://192.168.1.51:8123/local/mural-youtube-embed.html?v={{ youtube_id }}{% if bose_audio %}&mute=1{% endif %}
          navigate_embed_url_hdmi: >-
            http://192.168.1.51:8123/local/mural-youtube-embed.html?v={{ youtube_id }}
          path_yt: >-
            {% set base = states('input_text.mural_lovelace_path_youtube') | trim %}
            {{ base }}?v={{ youtube_id }}{% if bose_audio %}&mute=1{% endif %}
      - if:
          - condition: template
            value_template: "{{ not url_ok }}"
        then:
          - action: persistent_notification.create
            data:
              title: Mur — YouTube
              message: "URL incomplète (v=… ou youtu.be/…)."
              notification_id: mural_youtube_url_invalide
          - stop: "URL invalide"
      - action: input_text.set_value
        target:
          entity_id: input_text.mural_youtube_embed
        data:
          value: "{{ embed_url }}"
      - action: input_text.set_value
        target:
          entity_id: input_text.mural_youtube_url
        data:
          value: "{{ target_url }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ bose_audio and youtube_id | length >= 6 }}"
            sequence:
              - action: script.mural_youtube_avec_bose_sync
                data:
                  video_id: "{{ youtube_id }}"
                  target_url: "{{ target_url }}"
                  navigate_embed_url: "{{ navigate_embed_url }}"
                  navigate_embed_url_hdmi: "{{ navigate_embed_url_hdmi }}"
                  bose_player: "{{ bose_player }}"
          default:
            - action: rest_command.rasp5_kiosk_navigate
              data:
                url: "{{ navigate_embed_url_hdmi }}"
              continue_on_error: true

  mural_youtube_avec_bose_sync:
    alias: Mur — YouTube + Bose (sync audio/vidéo)
    mode: single
    icon: mdi:sync
    fields:
      video_id:
        description: ID YouTube
      target_url:
        description: URL complète
      navigate_embed_url:
        description: URL embed mur (muet)
      navigate_embed_url_hdmi:
        description: URL embed mur (son HDMI)
      bose_player:
        description: media_player cible
    sequence:
      - action: rest_command.rasp5_kiosk_navigate
        data:
          url: "{{ navigate_embed_url_hdmi }}&hold=1"
        continue_on_error: true
      - if:
          - condition: state
            entity_id: switch.multiprise_musique_bose
            state: "off"
        then:
          - action: switch.turn_on
            target:
              entity_id: switch.multiprise_musique_bose
            continue_on_error: true
          - delay:
              seconds: 12
        else:
          - delay:
              seconds: 2
      - if:
          - condition: template
            value_template: "{{ 'musique_bose_2' in bose_player }}"
        then:
          - action: rest_command.rasp5_kiosk_youtube_bose_play
            data:
              video_id: "{{ video_id }}"
              entity_id: "{{ bose_player }}"
              volume_percent: "{{ states('input_number.mural_bose_volume') | int(55) }}"
            continue_on_error: true
          - wait_for_trigger:
              - platform: state
                entity_id: media_player.musique_bose_2
                to: playing
            timeout: 180
            continue_on_error: true
          - delay:
              seconds: 1
          - if:
              - condition: template
                value_template: "{{ is_state(bose_player, 'playing') }}"
            then:
              - action: rest_command.rasp5_kiosk_navigate
                data:
                  url: "{{ navigate_embed_url }}&start=0"
                continue_on_error: true
            else:
              - action: media_player.play_media
                target:
                  entity_id: media_player.musique_bose_2
                data:
                  media_content_type: cast
                  media_content_id: >-
                    {"app_name":"youtube","media_id":"{{ video_id }}"}
                continue_on_error: true
              - delay:
                  seconds: 5
              - action: rest_command.rasp5_kiosk_set_pi_mute
                data:
                  muted: false
                continue_on_error: true
              - action: rest_command.rasp5_kiosk_navigate
                data:
                  url: "{{ navigate_embed_url_hdmi }}"
                continue_on_error: true
        else:
          - if:
              - condition: template
                value_template: "{{ 'musique_bose_4' in bose_player }}"
            then:
              - action: music_assistant.play_media
                data:
                  entity_id: "{{ bose_player }}"
                  media_id: "{{ target_url }}"
                  media_type: track
                  enqueue: replace
                continue_on_error: true
              - delay:
                  seconds: 4
              - action: music_assistant.play_media
                data:
                  entity_id: "{{ bose_player }}"
                  media_id: "{{ video_id }}"
                  media_type: track
                  enqueue: replace
                continue_on_error: true
              - action: rest_command.rasp5_kiosk_navigate
                data:
                  url: "{{ navigate_embed_url }}"
                continue_on_error: true
            else:
              - action: media_player.play_media
                target:
                  entity_id: "{{ bose_player }}"
                data:
                  media_content_id: "{{ target_url }}"
                  media_content_type: music
                continue_on_error: true
              - action: rest_command.rasp5_kiosk_navigate
                data:
                  url: "{{ navigate_embed_url }}"
                continue_on_error: true

  mural_retour_accueil_lovelace:
    alias: Mur — Retour accueil Lovelace
    mode: single
    icon: mdi:home-assistant
    sequence:
      - action: rest_command.rasp5_kiosk_navigate
        data:
          path: "{{ states('input_text.mural_lovelace_path_home') | trim }}"
        continue_on_error: true
      - action: media_player.media_pause
        target:
          entity_id: >-
            {{ states('input_select.mural_bose_media_player')
               | default('media_player.musique_bose_2', true) | trim }}
        continue_on_error: true
