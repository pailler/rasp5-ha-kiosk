<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mur — YouTube</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    iframe { border: 0; width: 100%; height: 100%; }
    .msg { color: #ccc; font-family: sans-serif; padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <iframe id="player" title="YouTube"></iframe>
  <script>
    (function () {
      var v = new URLSearchParams(location.search).get("v") || "";
      var el = document.getElementById("player");
      if (!v || v.length < 6) {
        document.body.innerHTML = '<p class="msg">Choisissez une vidéo dans Home Assistant puis « Afficher sur le mur ».</p>';
        return;
      }
      el.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(v) + "?autoplay=1&rel=0";
    })();
  </script>
</body>
</html>
