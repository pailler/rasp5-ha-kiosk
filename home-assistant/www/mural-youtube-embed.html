<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="referrer" content="strict-origin-when-cross-origin" />
  <title>Mur — YouTube</title>
  <style>
    html, body { margin: 0; height: 100%; background: #000; }
    iframe { border: 0; width: 100%; height: 100%; }
    .msg { color: #ccc; font-family: sans-serif; padding: 2rem; text-align: center; }
  </style>
</head>
<body>
  <iframe
    id="player"
    title="YouTube"
    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share; fullscreen"
    allowfullscreen
    referrerpolicy="strict-origin-when-cross-origin"
  ></iframe>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var v = params.get("v") || "";
      var mute = params.get("mute") === "1";
      var hold = params.get("hold") === "1";
      var startSec = parseInt(params.get("start") || params.get("t") || "0", 10);
      if (!Number.isFinite(startSec) || startSec < 0) startSec = 0;
      var el = document.getElementById("player");
      if (!v || v.length < 6) {
        document.body.innerHTML =
          '<p class="msg">Choisissez une vidéo dans Home Assistant puis « Afficher sur le mur ».</p>';
        return;
      }
      if (hold) {
        document.body.innerHTML =
          '<p class="msg">Synchronisation audio Bose…</p>';
        return;
      }
      var origin = location.protocol + "//" + location.host;
      var qs =
        (hold ? "autoplay=0" : "autoplay=1") +
        "&rel=0&playsinline=1&modestbranding=1" +
        "&origin=" + encodeURIComponent(origin) +
        "&widget_referrer=" + encodeURIComponent(origin);
      if (mute) qs += "&mute=1";
      if (startSec > 0) qs += "&start=" + startSec;
      el.src = "https://www.youtube.com/embed/" + encodeURIComponent(v) + "?" + qs;
    })();
  </script>
</body>
</html>
